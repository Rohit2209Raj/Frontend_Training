<!DOCTYPE html>
<html>
<head>
    <title>Facebook Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
        }

        .container {
            width: 360px;
            margin: 100px auto;
        }

        h1 {
            color: #1877f2;
            font-size: 45px;
            margin-bottom: 20px;
        }

        .login-box {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 10px gray;
        }

        h3 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .forgot {
            display: block;
            margin: 15px;
            color: #1877f2;
            text-decoration: none;
        }

        hr {
            border: 0;
            border-top: 1px solid #ddd;
        }

        .create-btn {
            padding: 12px 18px;
            background-color: #42b72a;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>facebook</h1>

        <div class="login-box">

            <h3>Log in to Facebook</h3>

            <form>

                <input 
                    type="text" 
                    placeholder="Email or phone number"
                >

                <input 
                    type="password" 
                    placeholder="Password"
                >

                <button class="login-btn">
                    Log In
                </button>

            </form>

            <a href="#" class="forgot">
                Forgotten password?
            </a>

            <hr>

            <button class="create-btn">
                Create New Account
            </button>

        </div>

    </div>

</body>
</html>
