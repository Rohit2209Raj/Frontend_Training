<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Board</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

/* ================= BOARD ================= */

.board {
    width: min(96vw, 700px);
    height: min(96vw, 700px);

    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(15, 1fr);

    border: 3px solid #222;
    background: white;
}

/* ================= HOME AREAS ================= */

.home {
    position: relative;
    border: 2px solid #222;

    display: flex;
    justify-content: center;
    align-items: center;
}

.home.green {
    background: #08a64a;
    grid-column: 1 / 7;
    grid-row: 1 / 7;
}

.home.yellow {
    background: #ffdf00;
    grid-column: 10 / 16;
    grid-row: 1 / 7;
}

.home.red {
    background: #f51d25;
    grid-column: 1 / 7;
    grid-row: 10 / 16;
}

.home.blue {
    background: #16499b;
    grid-column: 10 / 16;
    grid-row: 10 / 16;
}

/* Inner white square */

.inner {
    width: 75%;
    height: 75%;
    background: white;
    border: 3px solid #222;

    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 15%;
    padding: 10%;
}

/* ================= TOKENS ================= */

.token {
    width: 70%;
    height: 70%;
    border-radius: 50%;
    justify-self: center;
    align-self: center;
    border: 3px solid #222;
}

.green .token {
    background: #08a64a;
}

.yellow .token {
    background: #ffdf00;
}

.red .token {
    background: #f51d25;
}

.blue .token {
    background: #16499b;
}

/* ================= PATH CELLS ================= */

.cell {
    border: 1px solid #222;
    background: white;
}

/* Green horizontal path */
.g1 { grid-column: 1; grid-row: 7; }
.g2 { grid-column: 2; grid-row: 7; }
.g3 { grid-column: 3; grid-row: 7; }
.g4 { grid-column: 4; grid-row: 7; }
.g5 { grid-column: 5; grid-row: 7; }
.g6 { grid-column: 6; grid-row: 7; }

.g7 { grid-column: 1; grid-row: 8; }
.g8 { grid-column: 2; grid-row: 8; }
.g9 { grid-column: 3; grid-row: 8; }
.g10 { grid-column: 4; grid-row: 8; }
.g11 { grid-column: 5; grid-row: 8; }
.g12 { grid-column: 6; grid-row: 8; }

/* Green colored center lane */

.greenlane {
    background: #08a64a;
}

/* Yellow vertical path */

.yellowlane {
    background: #ffdf00;
}

/* Red vertical path */

.redlane {
    background: #f51d25;
}

/* Blue horizontal path */

.bluelane {
    background: #16499b;
}

/* ================= YELLOW PATH ================= */

.y1 { grid-column: 7; grid-row: 1; }
.y2 { grid-column: 8; grid-row: 1; }
.y3 { grid-column: 9; grid-row: 1; }

.y4 { grid-column: 7; grid-row: 2; }
.y5 { grid-column: 8; grid-row: 2; }
.y6 { grid-column: 9; grid-row: 2; }

.y7 { grid-column: 7; grid-row: 3; }
.y8 { grid-column: 8; grid-row: 3; }
.y9 { grid-column: 9; grid-row: 3; }

.y10 { grid-column: 7; grid-row: 4; }
.y11 { grid-column: 8; grid-row: 4; }
.y12 { grid-column: 9; grid-row: 4; }

.y13 { grid-column: 7; grid-row: 5; }
.y14 { grid-column: 8; grid-row: 5; }
.y15 { grid-column: 9; grid-row: 5; }

.y16 { grid-column: 7; grid-row: 6; }
.y17 { grid-column: 8; grid-row: 6; }
.y18 { grid-column: 9; grid-row: 6; }

/* Yellow center lane */
.yl {
    background: #ffdf00;
}

/* ================= RED PATH ================= */

.r1 { grid-column: 7; grid-row: 10; }
.r2 { grid-column: 8; grid-row: 10; }
.r3 { grid-column: 9; grid-row: 10; }

.r4 { grid-column: 7; grid-row: 11; }
.r5 { grid-column: 8; grid-row: 11; }
.r6 { grid-column: 9; grid-row: 11; }

.r7 { grid-column: 7; grid-row: 12; }
.r8 { grid-column: 8; grid-row: 12; }
.r9 { grid-column: 9; grid-row: 12; }

.r10 { grid-column: 7; grid-row: 13; }
.r11 { grid-column: 8; grid-row: 13; }
.r12 { grid-column: 9; grid-row: 13; }

.r13 { grid-column: 7; grid-row: 14; }
.r14 { grid-column: 8; grid-row: 14; }
.r15 { grid-column: 9; grid-row: 14; }

.r16 { grid-column: 7; grid-row: 15; }
.r17 { grid-column: 8; grid-row: 15; }
.r18 { grid-column: 9; grid-row: 15; }

.rl {
    background: #f51d25;
}

/* ================= BLUE PATH ================= */

.b1 { grid-column: 10; grid-row: 7; }
.b2 { grid-column: 11; grid-row: 7; }
.b3 { grid-column: 12; grid-row: 7; }
.b4 { grid-column: 13; grid-row: 7; }
.b5 { grid-column: 14; grid-row: 7; }
.b6 { grid-column: 15; grid-row: 7; }

.b7 { grid-column: 10; grid-row: 8; }
.b8 { grid-column: 11; grid-row: 8; }
.b9 { grid-column: 12; grid-row: 8; }
.b10 { grid-column: 13; grid-row: 8; }
.b11 { grid-column: 14; grid-row: 8; }
.b12 { grid-column: 15; grid-row: 8; }

.bl {
    background: #16499b;
}

/* ================= CENTER ================= */

.center {
    grid-column: 7 / 10;
    grid-row: 7 / 10;

    position: relative;
    overflow: hidden;
    border: 2px solid #222;
    background: white;
}

/* Four triangles */

.triangle {
    position: absolute;
    width: 0;
    height: 0;
}

.triangle.green {
    left: 0;
    top: 0;

    border-top: 50px solid transparent;
    border-bottom: 50px solid transparent;
    border-left: 50px solid #08a64a;
}

.triangle.yellow {
    top: 0;
    left: 0;

    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-top: 50px solid #ffdf00;
}

.triangle.red {
    bottom: 0;
    left: 0;

    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 50px solid #f51d25;
}

.triangle.blue {
    right: 0;
    top: 0;

    border-top: 50px solid transparent;
    border-bottom: 50px solid transparent;
    border-right: 50px solid #16499b;
}

/* Better center triangles */

.center::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        conic-gradient(
            from 45deg,
            #ffdf00 0deg 90deg,
            #16499b 90deg 180deg,
            #f51d25 180deg 270deg,
            #08a64a 270deg 360deg
        );

    clip-path: polygon(
        50% 50%,
        0 0,
        100% 0,
        50% 50%,
        100% 100%,
        0 100%
    );
}

/* ================= STARS ================= */

.star {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(18px, 3vw, 28px);
    background: white;
}

/* ================= ARROWS ================= */

.arrow {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: bold;
}

.arrow.yellow {
    color: #ffdf00;
}

.arrow.green {
    color: #08a64a;
}

.arrow.red {
    color: #f51d25;
}

.arrow.blue {
    color: #16499b;
}

/* ================= EXTRA CELLS ================= */

/* Top middle unused cells */
.top1 {
    grid-column: 7;
    grid-row: 1;
}

.top2 {
    grid-column: 8;
    grid-row: 1;
}

.top3 {
    grid-column: 9;
    grid-row: 1;
}

/* Side paths */
.side {
    border: 1px solid #222;
    background: white;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 500px) {
    .board {
        width: 98vw;
        height: 98vw;
    }

    .inner {
        gap: 8%;
        padding: 9%;
    }

    .token {
        border-width: 2px;
    }
}
</style>
</head>

<body>

<div class="board">

    <!-- GREEN HOME -->
    <div class="home green">
        <div class="inner">
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
        </div>
    </div>

    <!-- YELLOW HOME -->
    <div class="home yellow">
        <div class="inner">
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
        </div>
    </div>

    <!-- RED HOME -->
    <div class="home red">
        <div class="inner">
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
        </div>
    </div>

    <!-- BLUE HOME -->
    <div class="home blue">
        <div class="inner">
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
        </div>
    </div>


    <!-- TOP PATH -->
    <div class="cell" style="grid-column:7;grid-row:1;"></div>
    <div class="cell arrow yellow" style="grid-column:8;grid-row:1;">⬇</div>
    <div class="cell" style="grid-column:9;grid-row:1;"></div>

    <div class="cell" style="grid-column:7;grid-row:2;"></div>
    <div class="cell yll" style="grid-column:8;grid-row:2;background:#ffdf00;"></div>
    <div class="cell" style="grid-column:9;grid-row:2;"></div>

    <div class="cell" style="grid-column:7;grid-row:3;"></div>
    <div class="cell yll" style="grid-column:8;grid-row:3;background:#ffdf00;"></div>
    <div class="cell" style="grid-column:9;grid-row:3;"></div>

    <div class="cell" style="grid-column:7;grid-row:4;"></div>
    <div class="cell yll" style="grid-column:8;grid-row:4;background:#ffdf00;"></div>
    <div class="cell" style="grid-column:9;grid-row:4;"></div>

    <div class="cell" style="grid-column:7;grid-row:5;"></div>
    <div class="cell yll" style="grid-column:8;grid-row:5;background:#ffdf00;"></div>
    <div class="cell" style="grid-column:9;grid-row:5;"></div>

    <div class="cell" style="grid-column:7;grid-row:6;"></div>
    <div class="cell yll" style="grid-column:8;grid-row:6;background:#ffdf00;"></div>
    <div class="cell" style="grid-column:9;grid-row:6;"></div>


    <!-- LEFT PATH -->

    <div class="cell greenlane" style="grid-column:1;grid-row:7;"></div>
    <div class="cell" style="grid-column:2;grid-row:7;"></div>
    <div class="cell" style="grid-column:3;grid-row:7;"></div>
    <div class="cell" style="grid-column:4;grid-row:7;"></div>
    <div class="cell" style="grid-column:5;grid-row:7;"></div>
    <div class="cell" style="grid-column:6;grid-row:7;"></div>

    <div class="cell arrow green" style="grid-column:1;grid-row:8;">➜</div>
    <div class="cell greenlane" style="grid-column:2;grid-row:8;"></div>
    <div class="cell greenlane" style="grid-column:3;grid-row:8;"></div>
    <div class="cell greenlane" style="grid-column:4;grid-row:8;"></div>
    <div class="cell greenlane" style="grid-column:5;grid-row:8;"></div>
    <div class="cell greenlane" style="grid-column:6;grid-row:8;"></div>

    <div class="cell" style="grid-column:1;grid-row:9;"></div>
    <div class="cell" style="grid-column:2;grid-row:9;"></div>
    <div class="cell star" style="grid-column:3;grid-row:9;">☆</div>
    <div class="cell" style="grid-column:4;grid-row:9;"></div>
    <div class="cell" style="grid-column:5;grid-row:9;"></div>
    <div class="cell" style="grid-column:6;grid-row:9;"></div>


    <!-- RIGHT PATH -->

    <div class="cell" style="grid-column:10;grid-row:7;"></div>
    <div class="cell" style="grid-column:11;grid-row:7;"></div>
    <div class="cell" style="grid-column:12;grid-row:7;"></div>
    <div class="cell" style="grid-column:13;grid-row:7;"></div>
    <div class="cell star" style="grid-column:14;grid-row:7;">☆</div>
    <div class="cell" style="grid-column:15;grid-row:7;"></div>

    <div class="cell bluelane" style="grid-column:10;grid-row:8;"></div>
    <div class="cell bluelane" style="grid-column:11;grid-row:8;"></div>

    <div class="cell bluelane" style="grid-column:13;grid-row:8;"></div>
    <div class="cell bluelane" style="grid-column:14;grid-row:8;"></div>
    <div class="cell arrow blue" style="grid-column:15;grid-row:8;">←</div>

    <div class="cell" style="grid-column:10;grid-row:9;"></div>
    <div class="cell" style="grid-column:11;grid-row:9;"></div>
    <div class="cell" style="grid-column:12;grid-row:9;"></div>
    <div class="cell" style="grid-column:13;grid-row:9;"></div>
    <div class="cell" style="grid-column:14;grid-row:9;"></div>
    <div class="cell" style="grid-column:15;grid-row:9;"></div>


    <!-- BOTTOM PATH -->

    <div class="cell" style="grid-column:7;grid-row:10;"></div>
    <div class="cell rl" style="grid-column:8;grid-row:10;background:#f51d25;"></div>
    <div class="cell" style="grid-column:9;grid-row:10;"></div>

    <div class="cell" style="grid-column:7;grid-row:11;"></div>
    <div class="cell rl" style="grid-column:8;grid-row:11;background:#f51d25;"></div>
    <div class="cell" style="grid-column:9;grid-row:11;"></div>

    <div class="cell" style="grid-column:7;grid-row:12;"></div>
    <div class="cell rl" style="grid-column:8;grid-row:12;background:#f51d25;"></div>
    <div class="cell" style="grid-column:9;grid-row:12;"></div>

    <div class="cell" style="grid-column:7;grid-row:13;"></div>
    <div class="cell rl" style="grid-column:8;grid-row:13;background:#f51d25;"></div>
    <div class="cell star" style="grid-column:9;grid-row:13;">☆</div>

    <div class="cell" style="grid-column:7;grid-row:14;"></div>
    <div class="cell rl" style="grid-column:8;grid-row:14;background:#f51d25;"></div>

    <div class="cell" style="grid-column:7;grid-row:15;"></div>
    <div class="cell arrow red" style="grid-column:8;grid-row:15;">⬆</div>
    <div class="cell" style="grid-column:9;grid-row:15;"></div>


    <!-- CENTER -->
    <div class="center"></div>

</div>

</body>
</html>
